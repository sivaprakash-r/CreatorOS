services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creatoros
      POSTGRES_PASSWORD: creatoros
      POSTGRES_DB: creatoros
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatoros"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://creatoros:creatoros@db:5432/creatoros
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
